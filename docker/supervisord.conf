[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ── Laravel Octane (FrankenPHP) — HTTP control plane ──────────
[program:octane]
command=php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8000 --admin-port=2019 --max-requests=500
directory=/app
user=oxygen
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; ── Laravel queue worker — webhooks + jobs ────────────────────
[program:queue]
command=php artisan queue:work --sleep=1 --tries=3 --max-time=3600 --timeout=60
directory=/app
user=oxygen
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=65
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

; ── Raw Redis webhook consumer → Laravel queued jobs ──────────
[program:webhooks]
command=php artisan webhooks:consume --timeout=30
directory=/app
user=oxygen
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

; ── Laravel scheduler — daily rollup prune, etc. ──────────────
[program:scheduler]
command=php artisan schedule:work
directory=/app
user=oxygen
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40

; ── golang-queue — VOD transcode worker (ffmpeg → HLS → S3) ───
[program:go-queue]
command=/usr/local/bin/oxygen-queue
directory=/app
user=oxygen
autostart=true
autorestart=true
# Signal the Go parent only so it stops polling Redis while the claimed FFmpeg
# job finishes. If the grace period expires, killasgroup also terminates ffmpeg.
stopasgroup=false
killasgroup=true
; A VOD job is removed from Redis before FFmpeg starts. Let graceful shutdown
; wait for long-running jobs instead of killing them after 30 seconds.
stopwaitsecs=86400
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=50

; ── golang-analytics — private ingestion/query API ─────────────
[program:go-analytics]
command=/usr/local/bin/oxygen-analytics serve
directory=/app
user=oxygen
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=60

; ── golang-live — RTMP ingest + live HLS ──────────────────────
[program:go-live]
command=/usr/local/bin/oxygen-live
directory=/app
user=oxygen
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=70
